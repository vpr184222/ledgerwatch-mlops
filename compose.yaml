services:
  api:
    build: ./backend
    environment:
      API_TOKEN: ${API_TOKEN:-demo-ledger-token}
    volumes:
      - ledgerwatch-data:/srv/runtime
    ports:
      - "127.0.0.1:8000:8000"
  ui:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  ledgerwatch-data:
